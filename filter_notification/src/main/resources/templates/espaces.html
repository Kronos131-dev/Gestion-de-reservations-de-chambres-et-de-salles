<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Espaces & notifications</title>
    <link rel="stylesheet" th:href="@{/css/reserv.css}">
</head>
<body>

<h1>Liste des salles disponibles</h1>

<form th:action="@{/espaces}" method="get">

    <input type="hidden" name="sortOrder" id="sortOrder">

    <div class="sort-bar">
        <button type="submit" name="sortAttribute" value="PRIX_BASE"
                onclick="document.getElementById('sortOrder').value='ASCENDING'">
            Prix ↑
        </button>

        <button type="submit" name="sortAttribute" value="PRIX_BASE"
                onclick="document.getElementById('sortOrder').value='DESCENDING'">
            Prix ↓
        </button>

        <button type="submit" name="sortAttribute" value="NB_PLACES"
                onclick="document.getElementById('sortOrder').value='ASCENDING'">
            Places ↑
        </button>

        <button type="submit" name="sortAttribute" value="NB_PLACES"
                onclick="document.getElementById('sortOrder').value='DESCENDING'">
            Places ↓
        </button>
    </div>

    <div class="filters">
        <label>Min places :
            <input type="number" name="minNbPlaces" th:value="${filter.minNbPlaces}">
        </label>

        <label>Max places :
            <input type="number" name="maxNbPlaces" th:value="${filter.maxNbPlaces}">
        </label>

        <label>Min prix :
            <input type="number" step="0.01" name="minPrixBase" th:value="${filter.minPrixBase}">
        </label>

        <label>Max prix :
            <input type="number" step="0.01" name="maxPrixBase" th:value="${filter.maxPrixBase}">
        </label>

        <label>
            Disponible uniquement
            <input type="checkbox" name="onlyDisponible" th:checked="${filter.onlyDisponible}">
        </label>

        <button type="submit">Filtrer</button>
    </div>
</form>

<hr>

<h2>Espaces</h2>

<div th:if="${#lists.isEmpty(espaces)}">
    <p>Aucun espace trouvé.</p>
</div>

<div class="cards-container">
    <div th:each="e : ${espaces}" class="card">

        <p><strong>Places :</strong> <span th:text="${e.nbPlaces}"></span></p>
        <p><strong>Prix :</strong> <span th:text="${e.prixBase}"></span></p>
        <p><strong>Statut :</strong> <span th:text="${e.status}"></span></p>

        <form th:action="@{/espaces/{id}(id=${e.idEspace})}" method="post">

            <select name="status">
                <option th:each="s : ${T(fr.ulco.filter_notification.persistence.entities.Espace.Status).values()}"
                        th:value="${s}"
                        th:text="${s}"
                        th:selected="${s == e.status}">
                </option>
            </select>

            <button type="submit">Mettre à jour</button>
        </form>
    </div>
</div>

<hr>

<h2>Notifications utilisateur</h2>

<div th:if="${utilisateur == null || #lists.isEmpty(utilisateur.notifications)}">
    <p>Aucune notification.</p>
</div>

<ul th:if="${utilisateur != null}">
    <li th:each="n : ${utilisateur.notifications}">
        <strong th:text="${#temporals.format(n.dateCreation, 'dd/MM/yyyy HH:mm')}"></strong>
        :
        <span th:text="${n.contenu}"></span>
    </li>
</ul>

</body>
</html>
