<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Facturer un Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h3 class="card-title mb-0"
                        th:text="${prestation.idPrestation == null} ? 'Ajouter une consommation' : 'Modifier la facture'">
                    </h3>
                </div>
                <div class="card-body p-4">
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <form th:action="@{${prestation.idPrestation == null} ? '/prestations/create' : '/prestations/edit/' + ${prestation.idPrestation}}"
                          th:object="${prestation}"
                          method="post">
                        <div th:if="${prestation.idPrestation == null}" class="mb-4 p-3 bg-light border rounded">

                            <label class="form-label fw-bold">1. Quel service le client a-t-il pris ?</label>
                            <select name="idServiceSelected" class="form-select mb-3" required>
                                <option value="" disabled selected>-- Choisir dans le catalogue --</option>
                                <option th:each="s : ${servicesAvailable}"
                                        th:value="${s.id}"
                                        th:text="${s.nom} + ' (Prix unitaire : ' + ${s.prix} + '€)'">
                                </option>
                            </select>

                            <label class="form-label fw-bold">Quantité</label>
                            <input type="number" th:field="*{quantite}" class="form-control" value="1" min="1" required>
                            <small class="text-muted">Le prix total sera calculé automatiquement (Prix x Quantité).</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">2. Pour quelle Réservation (ID) ?</label>
                            <input type="number" th:field="*{idReservation}" class="form-control" placeholder="Ex: 12" required>
                        </div>
                        <div th:if="${prestation.idPrestation != null}" class="mb-3">
                            <label class="form-label text-danger">Prix (€) - Correction manuelle</label>
                            <input type="number" step="0.01" th:field="*{prix}" class="form-control">
                        </div>
                        <div th:if="${prestation.idPrestation != null}" class="mb-3">
                            <label class="form-label">ID Paiement</label>
                            <input type="number" th:field="*{idPaiement}" class="form-control">
                        </div>
                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/prestations}" class="btn btn-secondary">Annuler</a>
                            <button type="submit" class="btn btn-success">Enregistrer la Facture</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
