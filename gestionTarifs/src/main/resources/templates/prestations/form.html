<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Facturer un Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-header text-white py-3" style="background-color: #000292;">
                    <h3 class="card-title mb-0 fw-bold"
                        th:text="${prestation.idPrestation == null} ? 'Ajouter une consommation' : 'Modifier la facture'">
                    </h3>
                </div>
                <div class="card-body p-4">
                    <div th:if="${error}" class="alert alert-danger shadow-sm" th:text="${error}"></div>

                    <form th:action="@{${prestation.idPrestation == null} ? '/prestations/create' : '/prestations/edit/' + ${prestation.idPrestation}}"
                          th:object="${prestation}"
                          method="post">
                        <div th:if="${prestation.idPrestation == null}" class="mb-4 p-4 bg-white rounded shadow-sm"
                             style="border: 2px solid #FFB5B5;">
                            <h5 class="fw-bold mb-3" style="color: #000292;">1. Détails du Service</h5>

                            <label class="form-label fw-bold text-muted">Quel service le client a-t-il pris ?</label>
                            <select name="idServiceSelected" class="form-select mb-3 shadow-sm" required
                                    style="border: 1px solid #D5D5D5;">
                                <option value="" disabled selected>-- Choisir dans le catalogue --</option>
                                <option th:each="s : ${servicesAvailable}"
                                        th:value="${s.id}"
                                        th:text="${s.nom} + ' (Prix unitaire : ' + ${s.prix} + '€)'">
                                </option>
                            </select>

                            <div class="row">
                                <div class="col-md-4">
                                    <label class="form-label fw-bold text-muted">Quantité</label>
                                    <input type="number" th:field="*{quantite}" class="form-control shadow-sm"
                                           value="1" min="1" required style="border: 1px solid #D5D5D5;">
                                </div>
                                <div class="col-md-8 d-flex align-items-center">
                                    <small class="text-muted fst-italic mt-4">
                                         Le prix total sera calculé automatiquement (Prix x Quantité).
                                    </small>
                                </div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted">2. Pour quelle Réservation (ID) ?</label>
                            <input type="number" th:field="*{idReservation}" class="form-control shadow-sm"
                                   placeholder="Ex: 12" required style="border: 1px solid #D5D5D5;">
                        </div>

                        <div th:if="${prestation.idPrestation != null}" class="p-3 mb-3 bg-light rounded border">
                            <label class="form-label text-danger fw-bold">Prix (€)</label>
                            <input type="number" step="0.01" th:field="*{prix}" class="form-control shadow-sm">
                        </div>

                        <div th:if="${prestation.idPrestation != null}" class="mb-3">
                            <label class="form-label fw-bold text-muted">ID Paiement</label>
                            <input type="number" th:field="*{idPaiement}" class="form-control shadow-sm" style="border: 1px solid #D5D5D5;">
                        </div>

                        <hr class="text-muted my-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <a th:href="@{/prestations}" class="btn btn-outline-secondary">Annuler</a>

                            <button type="submit" class="btn btn-charte-blue px-4 py-2 shadow-sm">
                                Enregistrer la Facture
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
