<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Facturer Séjour</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">

  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h3 class="card-title mb-0">Facturer un Séjour (Chambre)</h3>
        </div>
        <div class="card-body p-4">
          <p class="mb-4">
            Ce formulaire va générer la facture automatiquement selon la formule :<br>
            <strong>Prix Chambre × Coefficient Saison × Nombre de Nuits</strong>
          </p>
          <form action="/prestations/sejour/create" method="post">
            <div class="mb-4">
              <label class="form-label fw-bold">Numéro de la Réservation (ID)</label>
              <input type="number" name="idReservation" class="form-control form-control-lg" placeholder="Ex: 101" required>
              <small class="text-muted">Assurez-vous que la réservation contient bien une chambre, une saison et une durée.</small>
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary btn-lg">Calculer et Générer la Facture</button>
              <a href="/prestations" class="btn btn-outline-secondary">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
