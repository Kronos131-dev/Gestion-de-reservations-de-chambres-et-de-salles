<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Facturer Séjour</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div class="container py-5">

  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow border-0">
        <div class="card-header text-white py-3" style="background-color: #000292;">
          <h3 class="card-title mb-0 fw-bold">Facturer un Séjour (Chambre)</h3>
        </div>

        <div class="card-body p-4">
          <div class="alert alert-light border mb-4 shadow-sm" style="border-color: #D5D5D5;">
            <p class="mb-0 text-muted">
              Ce formulaire va générer la facture automatiquement selon la formule :<br>
              <strong style="color: #000292;">Prix Chambre × Coefficient Saison × Nombre de Nuits</strong>
            </p>
          </div>
          <form action="/prestations/sejour/create" method="post">
            <div class="mb-4">
              <label class="form-label fw-bold text-muted">Numéro de la Réservation (ID)</label>
              <input type="number" name="idReservation" class="form-control form-control-lg shadow-sm"
                     placeholder="Ex: 101" required style="border: 2px solid #D5D5D5;">
              <small class="text-muted fst-italic mt-2 d-block">
                Assurez-vous que la réservation contient bien une chambre, une saison et une durée.
              </small>
            </div>

            <hr class="text-muted my-4">
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-charte-blue btn-lg shadow-sm">
                Calculer et Générer la Facture
              </button>
              <a href="/prestations" class="btn btn-outline-secondary">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
