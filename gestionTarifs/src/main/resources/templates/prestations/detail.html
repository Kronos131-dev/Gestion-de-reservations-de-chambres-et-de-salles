<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détail Facture</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">

    <div class="card mx-auto shadow-sm" style="max-width: 600px;">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">Détail de la Facture #<span th:text="${prestation.idPrestation}"></span></h4>
        </div>
        <div class="card-body">
            <div class="mb-3">
                <label class="fw-bold text-muted">Montant à payer</label>
                <div class="fs-2 text-primary" th:text="${prestation.prix} + ' €'"></div>
            </div>
            <hr>
            <div class="row">
                <div class="col-6">
                    <label class="fw-bold text-muted">Réservation Client</label>
                    <p class="fs-5" th:text="${prestation.idReservation}"></p>
                </div>
                <div class="col-6">
                    <label class="fw-bold text-muted">Référence Paiement</label>
                    <p>
                        <span th:if="${prestation.idPaiement != null}" class="badge bg-success" th:text="${prestation.idPaiement}"></span>
                        <span th:unless="${prestation.idPaiement != null}" class="text-danger">Non payé</span>
                    </p>
                </div>
            </div>
            <div class="mt-4 d-flex justify-content-between">
                <a th:href="@{/prestations}" class="btn btn-outline-secondary">Retour liste</a>
                <a th:href="@{'/prestations/edit/' + ${prestation.idPrestation}}" class="btn btn-warning">Modifier / Corriger</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
