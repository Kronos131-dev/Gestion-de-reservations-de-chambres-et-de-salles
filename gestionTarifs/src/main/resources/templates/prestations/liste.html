<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des Factures</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Gestion des Tarifs (Prestations)</h1>
        <a href="/service-extras" class="btn btn-outline-dark">
            Gérer les Services Extras &rarr;
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div class="d-flex gap-3 mb-4">
        <a th:href="@{/prestations/create}" class="btn btn-success">
            + Facturer un Service (Petit déj, Spa...)
        </a>
        <a th:href="@{/prestations/sejour/create}" class="btn btn-primary">
            + Facturer un Séjour (Chambre)
        </a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID Facture</th>
                    <th>Montant Total (€)</th>
                    <th>Réf. Réservation</th>
                    <th>Statut Paiement</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${prestations}">
                    <td th:text="${p.idPrestation}"></td>
                    <td class="fw-bold" th:text="${p.prix}"></td>
                    <td>
                        <span th:if="${p.idReservation != null}" class="badge bg-secondary" th:text="'Res #' + ${p.idReservation}"></span>
                        <span th:unless="${p.idReservation != null}" class="text-muted">-</span>
                    </td>
                    <td>
                        <span th:if="${p.idPaiement != null}" class="badge bg-success">Payé</span>
                        <span th:unless="${p.idPaiement != null}" class="badge bg-warning text-dark">En attente</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{'/prestations/' + ${p.idPrestation}}" class="btn btn-info btn-sm text-white">Voir</a>
                        <a th:href="@{'/prestations/edit/' + ${p.idPrestation}}" class="btn btn-warning btn-sm">Edit</a>
                        <a th:href="@{'/prestations/delete/' + ${p.idPrestation}}"
                           onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette facture ?')"
                           class="btn btn-danger btn-sm">X</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
