<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-header text-white py-3" style="background-color: #000292;">
                    <h3 class="card-title mb-0 fw-bold" th:text="${title}"></h3>
                </div>

                <div class="card-body p-4">
                    <form th:action="${action}" th:object="${serviceExtra}" method="post">
                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted">Nom du service</label>
                            <input type="text" th:field="*{nom}" class="form-control shadow-sm"
                                   placeholder="Ex: Petit Déjeuner Buffet" style="border: 1px solid #D5D5D5;">
                            <p class="text-danger small mt-1" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></p>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted">Description</label>
                            <textarea th:field="*{description}" class="form-control shadow-sm" rows="3"
                                      placeholder="Détails du service..." style="border: 1px solid #D5D5D5;"></textarea>
                            <p class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted">Prix (€)</label>
                            <input type="number" step="0.01" th:field="*{prix}" class="form-control shadow-sm"
                                   placeholder="0.00" style="border: 1px solid #D5D5D5;">
                            <p class="text-danger small mt-1" th:if="${#fields.hasErrors('prix')}" th:errors="*{prix}"></p>
                        </div>
                        <hr class="text-muted my-4">
                        <div class="d-flex justify-content-end gap-2">
                            <a href="/service-extras" class="btn btn-charte-pink shadow-sm">Annuler</a>
                            <button class="btn btn-charte-blue px-4 shadow-sm">Enregistrer</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
