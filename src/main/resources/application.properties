spring.application.name=gestion-chambre-salle
server.port=8080
server.servlet.context-path=/

# BDD:
spring.datasource.url=jdbc:postgresql://postgresql-gestion-chambres-salles.alwaysdata.net:5432/gestion-chambres-salles_bdd
spring.datasource.username=gestion-chambres-salles_arthur
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}



spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect




spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true



spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/static/**

spring.web.resources.add-mappings=true

