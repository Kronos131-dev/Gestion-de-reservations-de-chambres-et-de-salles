<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nouveau Type</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="page-title">
                        Nouveau Type
                    </h1>
                    <p class="text-muted mb-0">Créez un nouveau type d'espace</p>
                </div>
                <a href="/" class="btn btn-secondary">
                    Accueil
                </a>
            </div>

            <div class="card fade-in">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        Informations du type
                    </h5>
                </div>
                <div class="card-body">
                    <form action="/types/create" method="post">
                        <div class="form-group mb-3">
                            <label for="nom_espace" class="form-label">
                                Nom du type
                            </label>
                            <input type="text"
                                   id="nom_espace"
                                   name="nom_espace"
                                   class="form-control"
                                   th:value="${type != null ? type.nom_espace : ''}"
                                   required
                                   placeholder="Ex: Chambre Standard, Suite, ...">
                        </div>

                        <div class="form-group mb-3">
                            <label for="description" class="form-label">
                                Description
                            </label>
                            <textarea id="description"
                                      name="description"
                                      class="form-control"
                                      rows="3"
                                      required
                                      placeholder="Description de ce type d'espace...">[[${type != null ? type.description : ''}]]</textarea>
                        </div>


                        <div class="d-flex justify-content-between mt-4 pt-3 border-top">
                            <a href="/" class="btn btn-outline-secondary">
                                Annuler
                            </a>
                            <div>
                                <button type="submit" class="btn btn-success">
                                    Créer le type
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
