<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifier Espace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="page-title">Modifier l'Espace</h1>
                    <p class="text-muted">ID: <span th:text="${espace.id_espace}"></span></p>
                </div>
                <a href="/" class="btn btn-secondary">
                    Accueil
                </a>
            </div>

            <div class="card fade-in">
                <div class="card-header bg-warning text-white">
                    <h5 class="mb-0">Modification de l'espace</h5>
                </div>
                <div class="card-body">
                    <form th:action="'/espaces/' + ${espace.id_espace}"
                          th:object="${espace}"
                          method="post"
                          id="editForm">

                        <input type="hidden" th:field="*{id_espace}" />

                        <div class="form-group mb-4">
                            <h6 class="section-title">
                                Informations de base
                            </h6>

                            <div class="form-group mb-3">
                                <label class="form-label">Description</label>
                                <input type="text" class="form-control" th:field="*{description}"
                                       required
                                       placeholder="Description de l'espace...">
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nombre de places</label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" th:field="*{nb_place}"
                                               min="1" max="1000" required>
                                        <span class="input-group-text">personnes</span>
                                    </div>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Prix de base</label>
                                    <div class="input-group">
                                        <input type="number" step="0.01" class="form-control" th:field="*{prix_base}"
                                               min="0" required>
                                        <span class="input-group-text">€</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group mb-4">
                            <h6 class="section-title">
                                Configuration
                            </h6>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Statut</label>
                                    <select class="form-select" th:field="*{status}" required>
                                        <option value="DISPONIBLE">Disponible</option>
                                        <option value="OCCUPE">Occupé</option>
                                        <option value="EN_MAINTENANCE">En maintenance</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Type d'espace</label>
                                    <select class="form-control" name="typeId" required>
                                        <option th:each="type : ${types}"
                                                th:value="${type.id_type}"
                                                th:text="${type.nom_espace}"
                                                th:selected="${espace.typeEspace != null and espace.typeEspace.id_type == type.id_type}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4 pt-3 border-top">
                            <div>
                                <a href="/" class="btn btn-secondary">
                                    Annuler
                                </a>
                            </div>
                            <div>
                                <button type="submit" class="btn btn-warning" id="submitBtn">
                                    Mettre à jour
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card mt-4 fade-in">
                <div class="card-header">
                    <h6 class="mb-0">
                        Informations actuelles
                    </h6>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>ID :</strong> <span th:text="${espace.id_espace}"></span></p>
                            <p><strong>Statut :</strong> <span th:text="${espace.status}"></span></p>
                            <p><strong>Type :</strong>
                                <span th:text="${espace.typeEspace != null ? espace.typeEspace.nom_espace : 'Non défini'}"></span>
                            </p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Type actuel :</strong> <span th:text="${espace.typeEspace != null ? espace.typeEspace.nom_espace : 'Non défini'}"></span></p>
                            <p><strong>Statut actuel :</strong> <span th:text="${espace.status}"></span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('editForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            let isValid = true;
            const errors = [];

            const description = document.querySelector('[name="description"]').value;
            if (!description || description.trim().length < 2) {
                errors.push('La description doit contenir au moins 2 caractères');
                isValid = false;
            }

            const typeSelect = document.querySelector('select[name="typeId"]');
            if (!typeSelect || !typeSelect.value) {
                errors.push('Vous devez sélectionner un type d\'espace');
                isValid = false;
            }

            const prix = document.querySelector('[name="prix_base"]').value;
            if (!prix || parseFloat(prix) < 0) {
                errors.push('Le prix doit être positif ou nul');
                isValid = false;
            }

            if (!isValid) {
                e.preventDefault();

                let errorHtml = '<div class="alert alert-danger"><ul class="mb-0">';
                errors.forEach(error => {
                    errorHtml += '<li>' + error + '</li>';
                });
                errorHtml += '</ul></div>';

                const cardBody = document.querySelector('.card-body');
                const existingAlert = cardBody.querySelector('.alert-danger');
                if (existingAlert) {
                    existingAlert.remove();
                }
                cardBody.insertAdjacentHTML('afterbegin', errorHtml);

                window.scrollTo({ top: 0, behavior: 'smooth' });
                return false;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Mise à jour...';
            return true;
        });
    });
</script>
</body>
</html>
