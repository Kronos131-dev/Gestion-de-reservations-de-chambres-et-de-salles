<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nouvel Espace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="page-title">Nouvel Espace</h1>
                </div>
                <a href="/" class="btn btn-secondary">
                    Accueil
                </a>
            </div>

            <div class="card fade-in">
                <div class="card-body">
                    <form th:action="${espace.id_espace != null} ?
                                     '/espaces/' + ${espace.id_espace} :
                                     '/espaces'"
                          th:object="${espace}"
                          method="post"
                          id="espaceForm">

                        <input type="hidden" th:field="*{id_espace}" />

                        <div class="form-group mb-4">
                            <h6 class="section-title">
                                Informations de base
                            </h6>

                            <div class="form-group mb-3">
                                <label class="form-label">Description</label>
                                <input type="text" class="form-control" th:field="*{description}"
                                       required
                                       placeholder="Ex: Chambre 101 - Vue mer, Suite présidentielle..."
                                       aria-describedby="descriptionHelp">
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nombre de places</label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" th:field="*{nb_place}"
                                               min="1" max="1000" required
                                               aria-describedby="placesHelp">
                                        <span class="input-group-text">personnes</span>
                                    </div>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Prix de base</label>
                                    <div class="input-group">
                                        <input type="number" step="0.01" class="form-control" th:field="*{prix_base}"
                                               min="0" required
                                               aria-describedby="priceHelp">
                                        <span class="input-group-text">€</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group mb-4">
                            <h6 class="section-title">
                                Configuration
                            </h6>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Statut</label>
                                    <select class="form-select" th:field="*{status}" required>
                                        <option value="">Sélectionnez un statut...</option>
                                        <option value="DISPONIBLE">Disponible</option>
                                        <option value="OCCUPE">Occupé</option>
                                        <option value="EN_MAINTENANCE">En maintenance</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Type d'espace</label>
                                    <select class="form-control" name="typeId" required>
                                        <option value="">Sélectionnez un type...</option>
                                        <option th:each="type : ${types}"
                                                th:value="${type.id_type}"
                                                th:text="${type.nom_espace}"
                                                th:selected="${espace.typeEspace != null and espace.typeEspace.id_type == type.id_type}">
                                        </option>
                                    </select>
                                    <div class="form-text">
                                        <a href="/types/new" class="btn btn-small btn-success mt-1">
                                            Créer un nouveau type
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4 pt-3 border-top">
                            <div>
                                <a href="/" class="btn btn-secondary">
                                    Annuler
                                </a>
                            </div>
                            <div>
                                <button type="submit" class="btn btn-primary" id="submitBtn">
                                    Créer l'espace
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card mt-4 fade-in">
                <div class="card-header">
                    <h6 class="mb-0">
                        Types d'espaces disponibles
                    </h6>
                </div>
                <div class="card-body">
                    <div th:if="${types != null and not types.isEmpty()}" class="row">
                        <div th:each="type : ${types}" class="col-md-6 mb-2">
                            <div class="border rounded p-3">
                                <strong th:text="${type.nom_espace}"></strong>
                            </div>
                        </div>
                    </div>
                    <div th:if="${types == null or types.isEmpty()}" class="text-center py-3">
                        <p class="text-muted mb-2">Aucun type d'espace disponible</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('espaceForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusField = document.querySelector('[name="status"]');
        if (statusField && !statusField.value) {
            statusField.value = "DISPONIBLE";
        }

        form.addEventListener('submit', function(e) {
            let isValid = true;
            const errors = [];
            const description = document.querySelector('[name="description"]').value;
            if (!description || description.trim().length < 2) {
                errors.push('La description doit contenir au moins 2 caractères');
                isValid = false;
            }
            const typeSelect = document.querySelector('select[name="typeId"]');
            if (!typeSelect || !typeSelect.value) {
                errors.push('Vous devez sélectionner un type d\'espace');
                isValid = false;
            }
            const prix = document.querySelector('[name="prix_base"]').value;
            if (!prix || parseFloat(prix) < 0) {
                errors.push('Le prix doit être positif ou nul');
                isValid = false;
            }

            if (!isValid) {
                e.preventDefault();

                let errorHtml = '<div class="alert alert-danger"><ul class="mb-0">';
                errors.forEach(error => {
                    errorHtml += '<li>' + error + '</li>';
                });
                errorHtml += '</ul></div>';

                const cardBody = document.querySelector('.card-body');
                const existingAlert = cardBody.querySelector('.alert-danger');
                if (existingAlert) {
                    existingAlert.remove();
                }
                cardBody.insertAdjacentHTML('afterbegin', errorHtml);

                window.scrollTo({ top: 0, behavior: 'smooth' });
                return false;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Enregistrement...';
            return true;
        });

        form.addEventListener('input', function() {
            submitBtn.disabled = false;
        });
    });
</script>
</body>
</html>
